<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Captura & Subida Futura ELOHIM</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary: #38bdf8;
      --accent: #a855f7;
      --bg-dark: #070913;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 1.8rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      text-align: center;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"], select {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    .camera-trigger {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.05);
      border-radius: 20px;
      padding: 2rem 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.2rem;
    }

    .camera-trigger:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--primary);
    }

    .camera-trigger i {
      width: 42px;
      height: 42px;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .preview-container {
      width: 100%;
      height: 220px;
      border-radius: 18px;
      overflow: hidden;
      display: none;
      margin-bottom: 1.2rem;
      border: 1px solid var(--card-border);
      position: relative;
    }

    .preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #030712;
      font-weight: 800;
      font-size: 1rem;
      border: none;
      padding: 16px;
      border-radius: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #cameraInput {
      display: none;
    }

    .status-msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Subir Fotos a GitHub</h1>

    <!-- Selección de Carpeta -->
    <div class="form-group">
      <label>Carpeta Destino</label>
      <input type="text" id="folderNameInput" placeholder="Ej: 29092026 o NuevaCarpeta" value="29092026">
      <small style="color: #64748b; font-size: 0.75rem; margin-top: 4px; display: block;">
        Si la carpeta no existe, se creará automáticamente en GitHub.
      </small>
    </div>

    <!-- Botón de Disparo de Cámara Móvil -->
    <label>Fotografía</label>
    <div class="camera-trigger" onclick="document.getElementById('cameraInput').click()">
      <i data-lucide="camera"></i>
      <span style="font-weight: 700; font-size: 0.95rem;">Tomar Foto / Seleccionar</span>
    </div>

    <!-- Captura por cámara directa -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="mostrarVistaPrevia(event)">

    <!-- Previsualización -->
    <div class="preview-container" id="previewContainer">
      <img id="imagePreview" src="" alt="Previsualización">
    </div>

    <!-- Botón de Envío -->
    <button class="btn-submit" id="uploadBtn" onclick="subirImagen()" disabled>
      <i data-lucide="upload-cloud"></i> Subir e Integrar a Galería
    </button>

    <div class="status-msg" id="statusMessage"></div>
  </div>

  <script>
    // PEGA AQUÍ LA URL OBTENIDA DE GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = "TU_URL_DE_GOOGLE_APPS_SCRIPT";

    let imagenBase64 = "";
    let nombreArchivo = "";

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });

    function mostrarVistaPrevia(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById('imagePreview');
        img.src = e.target.result;
        document.getElementById('previewContainer').style.display = 'block';

        // Extraer base64 puro (sin el prefijo data:image/jpeg;base64,)
        imagenBase64 = e.target.result.split(',')[1];
        
        // Generar un nombre único basado en la fecha/hora actual
        const timestamp = new Date().getTime();
        nombreArchivo = `IMG_${timestamp}.jpg`;

        document.getElementById('uploadBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    async function subirImagen() {
      const folderName = document.getElementById('folderNameInput').value.trim();
      const statusMsg = document.getElementById('statusMessage');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!folderName) {
        alert("Por favor ingresa o selecciona un nombre de carpeta.");
        return;
      }

      uploadBtn.disabled = true;
      statusMsg.style.color = "#38bdf8";
      statusMsg.innerText = "Subiendo imagen a GitHub...";

      const payload = {
        folderName: folderName,
        fileName: nombreArchivo,
        fileData: imagenBase64
      };

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          statusMsg.style.color = "#10b981";
          statusMsg.innerText = "¡Foto subida con éxito! Actualizando la galería...";

          // Resetear formulario
          setTimeout(() => {
            document.getElementById('previewContainer').style.display = 'none';
            statusMsg.innerText = "";
            document.getElementById('cameraInput').value = "";
          }, 3000);

        } else {
          throw new Error(result.message);
        }

      } catch (err) {
        statusMsg.style.color = "#ef4444";
        statusMsg.innerText = "Error al subir la imagen. Inténtalo de nuevo.";
        uploadBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
